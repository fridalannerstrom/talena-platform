{% load i18n %}
{# Talena candidate i18n batch 1 #}
<section class="candidate-insights-navigation">

  <div class="candidate-profile-tabs-wrap">

    <div
      class="candidate-profile-tabs"
      role="tablist"
      aria-label="{% trans 'Candidate insight areas' %}"
    >

      <button
        type="button"
        class="candidate-tab is-active"
        role="tab"
        aria-selected="true"
        aria-controls="candidate-insights-panel-overview"
        data-insights-tab="overview"
      >
        {% trans "Summary" %}
      </button>


      <button
        type="button"
        class="candidate-tab {% if not has_personality_results %}opacity-50{% endif %}"
        role="tab"
        aria-selected="false"
        aria-controls="candidate-insights-panel-personality"
        data-insights-tab="personality"
      >
        {% trans "Personality" %}
      </button>


      <button
        type="button"
        class="candidate-tab {% if not has_motivation_results %}opacity-50{% endif %}"
        role="tab"
        aria-selected="false"
        aria-controls="candidate-insights-panel-motivation"
        data-insights-tab="motivation"
      >
        {% trans "Motivation" %}
      </button>


<button
  type="button"
  class="
    candidate-tab
    {% if is_historical %}
      {% if not has_ability_results %}opacity-50{% endif %}
    {% else %}
      {% if not candidate_insights.cognitive_results and not has_ability_results %}
        opacity-50
      {% endif %}
    {% endif %}
  "
  role="tab"
  aria-selected="false"
  aria-controls="candidate-insights-panel-cognitive"
  data-insights-tab="cognitive"
>
  {% trans "Cognitive abilities" %}
</button>


      <button
        type="button"
        class="candidate-tab {% if not team_style_profile.available %}opacity-50{% endif %}"
        role="tab"
        aria-selected="false"
        aria-controls="candidate-insights-panel-team-styles"
        data-insights-tab="team-styles"
      >
        {% trans "Team styles" %}
      </button>


      <button
        type="button"
        class="candidate-tab"
        role="tab"
        aria-selected="false"
        aria-controls="candidate-insights-panel-questions"
        data-insights-tab="questions"
      >
        {% trans "Questions" %}
      </button>


      <button
        type="button"
        class="candidate-tab"
        role="tab"
        aria-selected="false"
        aria-controls="candidate-insights-panel-final-output"
        data-insights-tab="final-output"
      >
        {% trans "Final output" %}
      </button>

    </div>

  </div>

</section>
