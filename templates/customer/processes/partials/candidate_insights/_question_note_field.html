{% load i18n %}

<div
  class="interview-question-note"
  data-interview-question-note-field
>
  <div class="interview-question-note__header">
    <label class="interview-question-note__label">
      <i data-feather="message-square" aria-hidden="true"></i>
      {% trans "Answer / notes" %}
    </label>

    <span
      class="interview-question-note__status"
      data-interview-question-note-status
      aria-live="polite"
    ></span>
  </div>

  <textarea
    class="form-control interview-question-note__input"
    rows="2"
    maxlength="5000"
    placeholder="{% trans 'Add the candidate’s answer, examples or your interview notes…' %}"
    data-interview-question-note
    data-question-source="{{ question_source }}"
    data-question-text="{{ item.question|escape }}"
    data-notes-url="{% url 'processes:process_candidate_interview_question_notes' process.id candidate.id %}"
    data-update-url="{% url 'processes:process_candidate_interview_question_note_update' process.id candidate.id %}"
  ></textarea>

  <div class="interview-question-note__hint">
    {% trans "Saved automatically and available across the candidate view." %}
  </div>
</div>
