{% comment %}
Compact per-assessment status, shared by customer and Talena-admin project views.
Server-provided state, label and explanation remain available to assistive
technology and as a native tooltip. The icon changes during status polling.
{% endcomment %}
<span class="talena-assessment-state talena-assessment-state--{{ cell.tone }}"
      data-assessment-status
      data-state="{{ cell.state }}"
      data-invitation-id="{{ inv.id }}"
      data-test-key="{{ cell.key }}"
      title="{{ cell.title }}"
      role="img"
      aria-label="{{ cell.title }}"
      tabindex="0">
  <svg class="talena-assessment-state__symbol"
       xmlns="http://www.w3.org/2000/svg"
       width="19" height="19" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round"
       aria-hidden="true" focusable="false">
    <path d="{{ cell.icon_path }}"></path>
  </svg>
  <span class="visually-hidden talena-assessment-state__label">{{ cell.label }}</span>
</span>
