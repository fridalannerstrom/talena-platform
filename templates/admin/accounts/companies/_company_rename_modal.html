<div class="modal fade" id="companyRenameModal" tabindex="-1"
     aria-labelledby="companyRenameModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="post" action="{% url 'accounts:company_rename' company.pk %}">
        {% csrf_token %}
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="companyRenameModalLabel">Rename company</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <label for="companyRenameName" class="form-label fw-semibold">Company name</label>
          <input type="text" id="companyRenameName" name="name" class="form-control"
                 value="{{ company.name }}" maxlength="255" autocomplete="organization" required>
          <p class="form-text mb-0">
            Only the display name in Talena changes. Company ID, organisation number and
            Sova integrations stay the same.
          </p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save name</button>
        </div>
      </form>
    </div>
  </div>
</div>
