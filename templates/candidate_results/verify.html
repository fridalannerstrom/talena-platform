{% load i18n %}
<!doctype html>
<html lang="{{ request.LANGUAGE_CODE|default:'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ copy.verify_title }} · Talena</title>
  <style>
    :root { color-scheme: dark; --bg: #07111d; --card: #101d2a; --text: #f4f7fb; --muted: #a9b7c7; --green: #63d69b; --line: #2b3d50; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #17324a, var(--bg) 58%); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .card { width: min(100%, 500px); padding: clamp(28px, 6vw, 52px); background: rgba(16, 29, 42, .96); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 24px 70px rgba(0, 0, 0, .28); }
    .brand { color: var(--green); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: .78rem; }
    h1 { margin: 18px 0 12px; font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.1; }
    p { color: var(--muted); line-height: 1.65; }
    label { display: block; margin: 28px 0 8px; font-weight: 700; }
    input { width: 100%; padding: 15px 16px; border: 1px solid var(--line); border-radius: 12px; background: #0a1623; color: var(--text); font-size: 1.15rem; letter-spacing: .18em; }
    button { width: 100%; margin-top: 18px; padding: 15px 18px; border: 0; border-radius: 12px; background: var(--green); color: #082016; font-weight: 800; cursor: pointer; font-size: 1rem; }
    .error { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: rgba(226, 112, 112, .13); color: #ffb6b6; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Talena</div>
    <h1>{{ copy.verify_title }}</h1>
    <p>{{ copy.verify_intro }}</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" autocomplete="off">
      {% csrf_token %}
      <label for="verification_code">{{ copy.code_label }}</label>
      <input id="verification_code" name="verification_code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="{{ copy.code_placeholder }}" required autofocus>
      <button type="submit">{{ copy.verify_button }}</button>
    </form>
  </main>
</body>
</html>
