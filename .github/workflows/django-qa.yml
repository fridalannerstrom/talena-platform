name: Django QA

on:
  pull_request:
    branches:
      - main

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations to a fresh SQLite database
        env:
          DJANGO_DEBUG: 'True'
          DJANGO_SECRET_KEY: local-qa-only
          USE_AZURE_STORAGE: '0'
        run: |
          rm -f db.sqlite3
          python manage.py migrate --noinput
      - name: Check migration state
        env:
          DJANGO_DEBUG: 'True'
          DJANGO_SECRET_KEY: local-qa-only
          USE_AZURE_STORAGE: '0'
        run: python manage.py makemigrations processes candidate_results emails accounts --check --dry-run
      - name: Verify privacy warning for blocked interview note saves
        run: node scripts/test_interview_note_pii_save.js
      - name: Verify After interview final output refresh state
        run: node scripts/test_after_interview_final_output_refresh.js
      - name: Verify shared team PDF export and anonymous privacy contract
        run: |
          node --check static/js/talena/pdf-export-core.js
          node --check static/js/talena/team-report-export.js
          node --check static/js/talena/team-profile-export.js
          node scripts/test_team_report_pdf_contract.js
          node scripts/test_team_report_anonymous_runtime.js
          node scripts/test_team_profile_branding_contract.js
          node --check static/js/talena/candidate-report-pdf.js
          node scripts/test_candidate_report_pdf_contract.js
          node scripts/test_pdf_a4_cover_regression.js
      - name: Run focused candidate result, interview, project pin, and account invite tests
        env:
          DJANGO_DEBUG: 'True'
          DJANGO_SECRET_KEY: local-qa-only
          USE_AZURE_STORAGE: '0'
        run: python manage.py test apps.accounts.test_report_branding apps.emails.tests apps.emails.test_company_invitation_templates apps.ai_chat.tests apps.accounts.tests apps.accounts.test_usage_billing_export apps.candidate_results apps.processes.test_interview_question_notes apps.processes.test_tenant_authorization apps.processes.test_report_team_tenant_access apps.processes.test_historical_report_downloads apps.processes.test_candidate_data_audit apps.processes.test_retention_preview apps.core.tests.PostInterviewContentBlockTests apps.core.test_sova_template_account apps.core.test_ai_pii_notices apps.core.test_ai_pii_sanitizer apps.core.test_ai_payload_inventory apps.core.test_ai_payload_interview_team apps.core.test_ai_payload_candidate_results apps.core.test_ai_payload_question_repair apps.core.test_sensitive_debug_logging apps.core.test_candidate_debug_logging apps.core.test_ai_privacy_notice apps.core.test_ai_local_ner_contract apps.core.test_post_interview_question_evidence.PostInterviewQuestionEvidenceTests.test_stream_saves_complete_content_blocks_without_legacy_fields apps.processes.test_pinned_projects apps.processes.test_process_create_accounts apps.processes.test_sova_modern_project_names apps.reports.test_profile_contrasts apps.teams apps.core.test_purpose_fit_evidence --noinput
