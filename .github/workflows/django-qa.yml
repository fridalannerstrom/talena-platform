name: Django QA

on:
  pull_request:
    branches:
      - main

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations to a fresh SQLite database
        env:
          DJANGO_DEBUG: 'True'
          DJANGO_SECRET_KEY: local-qa-only
          USE_AZURE_STORAGE: '0'
        run: |
          rm -f db.sqlite3
          python manage.py migrate --noinput
      - name: Check migration state
        env:
          DJANGO_DEBUG: 'True'
          DJANGO_SECRET_KEY: local-qa-only
          USE_AZURE_STORAGE: '0'
        run: python manage.py makemigrations processes candidate_results --check --dry-run
      - name: Run focused candidate result, interview, project pin, and account invite tests
        env:
          DJANGO_DEBUG: 'True'
          DJANGO_SECRET_KEY: local-qa-only
          USE_AZURE_STORAGE: '0'
        run: python manage.py test apps.ai_chat.tests apps.accounts.tests apps.accounts.test_usage_billing_export apps.candidate_results apps.processes.test_interview_question_notes apps.core.tests.PostInterviewContentBlockTests apps.core.test_ai_pii_notices apps.core.test_post_interview_question_evidence.PostInterviewQuestionEvidenceTests.test_stream_saves_complete_content_blocks_without_legacy_fields apps.processes.test_pinned_projects apps.processes.test_process_create_accounts apps.reports.test_profile_contrasts apps.teams --noinput
