name: AI Privacy Notice

on:
  pull_request:
    branches:
      - main

jobs:
  verify-notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test privacy acknowledgement without OpenAI access
        env:
          DJANGO_DEBUG: 'True'
          DJANGO_SECRET_KEY: local-qa-only
          USE_AZURE_STORAGE: '0'
        run: python manage.py test apps.core.test_ai_privacy_notice --noinput
